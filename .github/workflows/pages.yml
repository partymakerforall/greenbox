name: Verify, deploy Pages and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: developer/age-recovery/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.1'
          cache: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          npm ci --ignore-scripts --prefix developer/age-recovery
          go install filippo.io/age/cmd/age@v1.3.1
          go install filippo.io/age/cmd/age-keygen@v1.3.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify builds and tests
        run: make check
      - name: Audit dependencies
        run: make audit
      - name: Build the standalone release
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then unset RELEASE_TAG; fi
          node developer/release/build.mjs
      - name: Upload versioned release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: standalone-release
          path: _releases/
          if-no-files-found: error
      - name: Package the two public pages
        run: make pages
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: standalone-release
          path: release
      - name: Publish the versioned HTML and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/greenbox-*.html release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Greenbox $RELEASE_TAG" \
            --notes-file release/RELEASE-NOTES.md
